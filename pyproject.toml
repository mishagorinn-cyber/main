[project]
name = "syrve-ontopo-connector"
version = "0.1.0"
description = "Connector between Syrve POS (table availability) and Ontopo (reservations)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
syrve-ontopo = "connector.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connector*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
