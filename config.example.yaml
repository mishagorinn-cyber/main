# Copy to config.yaml and fill in. ${VAR} and ${VAR:-default} are read from the environment.
timezone: Asia/Jerusalem

syrve:
  base_url: https://api-eu.syrve.live
  api_login: ${SYRVE_API_LOGIN}
  # Run `python -m connector discover` to find these ids.
  organization_id: ${SYRVE_ORGANIZATION_ID}
  terminal_group_id: ${SYRVE_TERMINAL_GROUP_ID}
  restaurant_section_ids: []     # empty = all halls of the terminal group
  customer_type: regular         # regular | one-time
  should_remind: true

ontopo:
  # Staging; replace with the production URL Ontopo gives you.
  base_url: ${ONTOPO_BASE_URL:-https://top-openapi.staging-01.ontopo.cz}
  api_key: ${ONTOPO_API_KEY}     # venue key, sent as x-api-key
  # Optional: register the webhook as https://<host>/webhooks/ontopo?token=<this value>
  webhook_token: ${ONTOPO_WEBHOOK_TOKEN:-}
  poll_reservations: true        # re-read /pos/reservationsForToday as a safety net
  poll_interval_seconds: 300

reservations:
  default_duration_minutes: 120  # when Ontopo sends no duration
  buffer_minutes: 15
  auto_assign_tables: true
  allow_table_combining: false
  report_assigned_tables: true   # tell Ontopo which table Syrve got
  table_map: {}                  # "<ontopo table>": "<syrve table number, name or id>"
  max_attempts: 8
  retry_base_seconds: 15

orders:
  enabled: true                  # Syrve table orders -> Ontopo (seated / done / walk-ins)
  sync_interval_seconds: 30
  early_arrival_minutes: 45
  create_walk_ins: true
  include_items: true

storage:
  path: data/connector.db

server:
  host: 0.0.0.0
  port: 8080
  admin_token: ${ADMIN_TOKEN:-}
